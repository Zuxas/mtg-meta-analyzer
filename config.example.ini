[database]
# Copy this file to config.ini and adjust paths for your machine.
# config.ini is gitignored — this example file is what gets committed.

# Path to the active SQLite database (data within the retention window).
path = data/mtg_meta.db

# Path to the archive database (data older than the retention window).
archive_path = data/mtg_archive.db

[retention]
# Per-format rolling retention windows in days. Set to 0 to disable for a format.
standard  = 1095
pioneer   = 1095
modern    = 1095
legacy    = 1095
vintage   = 1095
pauper    = 1095

# Standard events containing Foundations-set cards use this longer window (5 years).
foundations_days = 1825

# Comma-separated set codes that get the extended Foundations lifespan.
foundations_sets = FDN
