name: mtg-meta-analyzer CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  issues: write

jobs:
  imports:
    name: Module import check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install dependencies
        run: pip install requests thefuzz
      - name: Verify core module imports
        run: |
          python -c "
          import sys
          modules = [
              'analysis.win_rates',
              'analysis.meta_scoring',
              'analysis.deck_analysis',
              'analysis.archetypes',
              'analysis.predictions',
              'analysis.ratings',
              'scrapers.spicerack_scraper',
              'scrapers.event_finder',
              'db.database',
              'db.event_hub_db',
          ]
          failed = []
          for m in modules:
              try:
                  __import__(m)
                  print(f'  OK  {m}')
              except Exception as e:
                  print(f'  FAIL {m}: {e}')
                  failed.append(m)
          if failed:
              print(f'\nFailed imports: {failed}')
              sys.exit(1)
          print(f'\nAll {len(modules)} modules import cleanly.')
          "
      - name: Report failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = `[CI] imports failed — mtg-meta-analyzer`;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              labels: 'needs-fix', state: 'open',
            });
            const existing = issues.find(i => i.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.number,
                body: `Recurred ${new Date().toISOString().slice(0,10)} — [run](${runUrl})`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, labels: ['needs-fix'],
                body: `**Job:** imports\n**Branch:** ${context.ref.replace('refs/heads/','')}\n**Commit:** \`${context.sha.slice(0,7)}\`\n**Run:** [View logs](${runUrl})\n\nA module failed to import. Check for broken dependencies or missing packages.`,
              });
            }

  scraper-api:
    name: Scraper API surface
    runs-on: ubuntu-latest
    needs: imports
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install dependencies
        run: pip install requests
      - name: Spicerack scraper API
        run: |
          python -c "
          from scrapers.spicerack_scraper import scrape_events, show_counts
          import inspect, sys
          assert callable(scrape_events), 'scrape_events missing'
          assert callable(show_counts), 'show_counts missing'
          assert 'format_name' in inspect.signature(scrape_events).parameters, 'scrape_events missing format_name param'
          print('Spicerack scraper API surface OK')
          "
      - name: Event finder geocode smoke test
        run: |
          python -c "
          from scrapers.event_finder import geocode_zipcode
          lat, lng = geocode_zipcode('98101')
          assert 47 < lat < 48, f'Bad lat: {lat}'
          assert -123 < lng < -122, f'Bad lng: {lng}'
          print(f'Geocode OK: {lat:.4f}, {lng:.4f}')
          "
      - name: Report failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = `[CI] scraper-api failed — mtg-meta-analyzer`;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              labels: 'needs-fix', state: 'open',
            });
            const existing = issues.find(i => i.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.number,
                body: `Recurred ${new Date().toISOString().slice(0,10)} — [run](${runUrl})`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, labels: ['needs-fix'],
                body: `**Job:** scraper-api\n**Branch:** ${context.ref.replace('refs/heads/','')}\n**Commit:** \`${context.sha.slice(0,7)}\`\n**Run:** [View logs](${runUrl})\n\nSpicerack or event finder API surface broken. Check scraper changes.`,
              });
            }

  predictions-gate:
    name: Predictions accuracy gate (AI semantic check)
    runs-on: self-hosted
    needs: imports
    if: |
      github.event_name == 'pull_request' &&
      (contains(join(github.event.pull_request.changed_files, ','), 'analysis/') ||
       contains(join(github.event.pull_request.changed_files, ','), 'scrapers/'))
    env:
      MTG_META_DB: ${{ vars.MTG_META_DB || 'E:/vscode ai project/mtg-meta-analyzer/data/mtg_meta.db' }}
    steps:
      - uses: actions/checkout@v4
      - name: Run predictions validation
        shell: bash
        run: |
          python -c "
          import json, sys
          from analysis.predictions import validate_predictions
          result = validate_predictions()
          validated = result.get('validated', 0)
          correct   = result.get('correct', 0)
          wrong     = result.get('wrong', 0)
          print(f'Predictions validated: {validated}')
          print(f'  Correct: {correct}')
          print(f'  Wrong:   {wrong}')
          if validated == 0:
              print('No predictions to validate -- gate skipped')
              sys.exit(0)
          accuracy = correct / validated
          print(f'  Accuracy: {accuracy:.1%}')
          MIN_ACCURACY = 0.55
          MIN_VALIDATED = 5
          if validated < MIN_VALIDATED:
              print(f'Only {validated} predictions (need {MIN_VALIDATED}) -- gate skipped')
              sys.exit(0)
          if accuracy < MIN_ACCURACY:
              print(f'FAIL: accuracy {accuracy:.1%} below {MIN_ACCURACY:.0%} threshold')
              sys.exit(1)
          print(f'PASS: accuracy {accuracy:.1%} >= {MIN_ACCURACY:.0%}')
          "
      - name: Report failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = `[CI] predictions-gate failed — mtg-meta-analyzer`;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              labels: 'needs-fix', state: 'open',
            });
            const existing = issues.find(i => i.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.number,
                body: `Recurred ${new Date().toISOString().slice(0,10)} — [run](${runUrl})`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, labels: ['needs-fix'],
                body: `**Job:** predictions-gate\n**Branch:** ${context.ref.replace('refs/heads/','')}\n**Commit:** \`${context.sha.slice(0,7)}\`\n**Run:** [View logs](${runUrl})\n\nPredictions accuracy dropped below 55%. Check archetype normalization, win rate calc, or scraper output format.`,
              });
            }

  gui-imports:
    name: GUI import sanity
    runs-on: self-hosted
    needs: imports
    if: |
      contains(join(github.event.pull_request.changed_files, ','), 'gui/')
    steps:
      - uses: actions/checkout@v4
      - name: GUI module imports
        shell: bash
        run: |
          python -c "
          import sys
          gui_modules = [
              'gui.tabs.event_hub_tab',
              'gui.tabs.tournament_prep',
              'gui.tabs.dashboard',
              'db.event_hub_db',
          ]
          failed = []
          for m in gui_modules:
              try:
                  __import__(m)
                  print(f'  OK  {m}')
              except Exception as e:
                  print(f'  FAIL {m}: {e}')
                  failed.append(m)
          if failed:
              sys.exit(1)
          "
      - name: Report failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = `[CI] gui-imports failed — mtg-meta-analyzer`;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              labels: 'needs-fix', state: 'open',
            });
            const existing = issues.find(i => i.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.number,
                body: `Recurred ${new Date().toISOString().slice(0,10)} — [run](${runUrl})`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, labels: ['needs-fix'],
                body: `**Job:** gui-imports\n**Branch:** ${context.ref.replace('refs/heads/','')}\n**Commit:** \`${context.sha.slice(0,7)}\`\n**Run:** [View logs](${runUrl})\n\nA PyQt6 GUI module failed to import. Check gui/ changes for broken imports.`,
              });
            }
