name: mtg-meta-analyzer CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  issues: write

jobs:
  imports:
    name: Module import check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - name: Install dependencies
        run: pip install requests thefuzz
      - name: Verify core module imports
        run: |
          python -c "
          import sys
          modules = [
              'analysis.win_rates',
              'analysis.meta_scoring',
              'analysis.deck_analysis',
              'analysis.archetypes',
              'analysis.predictions',
              'analysis.ratings',
              'scrapers.spicerack_scraper',
              'scrapers.event_finder',
              'db.database',
              'db.event_hub_db',
          ]
          failed = []
          for m in modules:
              try:
                  __import__(m)
                  print(f'  OK  {m}')
              except Exception as e:
                  print(f'  FAIL {m}: {e}')
                  failed.append(m)
          if failed:
              print(f'\nFailed imports: {failed}')
              sys.exit(1)
          print(f'\nAll {len(modules)} modules import cleanly.')
          "
      - name: Report failure
        if: failure()
        uses: actions/github-script@v8
        with:
          script: |
            const title = `[CI] imports failed — mtg-meta-analyzer`;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              labels: 'needs-fix', state: 'open',
            });
            const existing = issues.find(i => i.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.number,
                body: `Recurred ${new Date().toISOString().slice(0,10)} — [run](${runUrl})`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, labels: ['needs-fix'],
                body: `**Job:** imports\n**Branch:** ${context.ref.replace('refs/heads/','')}\n**Commit:** \`${context.sha.slice(0,7)}\`\n**Run:** [View logs](${runUrl})\n\nA module failed to import. Check for broken dependencies or missing packages.`,
              });
            }

  scraper-api:
    name: Scraper API surface
    runs-on: ubuntu-latest
    needs: imports
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - name: Install dependencies
        run: pip install requests
      - name: Spicerack scraper API
        run: |
          python -c "
          from scrapers.spicerack_scraper import fetch_tournaments, scrape_format, show_counts
          import inspect
          assert callable(fetch_tournaments), 'fetch_tournaments missing'
          assert callable(scrape_format), 'scrape_format missing'
          assert callable(show_counts), 'show_counts missing'
          assert 'event_format' in inspect.signature(scrape_format).parameters, 'scrape_format missing event_format param'
          print('Spicerack scraper API surface OK')
          "
      - name: Event finder geocode smoke test
        run: |
          python -c "
          from scrapers.event_finder import geocode_zipcode
          lat, lng = geocode_zipcode('98101')
          assert 47 < lat < 48, f'Bad lat: {lat}'
          assert -123 < lng < -122, f'Bad lng: {lng}'
          print(f'Geocode OK: {lat:.4f}, {lng:.4f}')
          "
      - name: Report failure
        if: failure()
        uses: actions/github-script@v8
        with:
          script: |
            const title = `[CI] scraper-api failed — mtg-meta-analyzer`;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              labels: 'needs-fix', state: 'open',
            });
            const existing = issues.find(i => i.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.number,
                body: `Recurred ${new Date().toISOString().slice(0,10)} — [run](${runUrl})`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, labels: ['needs-fix'],
                body: `**Job:** scraper-api\n**Branch:** ${context.ref.replace('refs/heads/','')}\n**Commit:** \`${context.sha.slice(0,7)}\`\n**Run:** [View logs](${runUrl})\n\nSpicerack or event finder API surface broken. Check scraper changes.`,
              });
            }

  gui-imports:
    name: GUI import sanity
    runs-on: ubuntu-latest
    needs: imports
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'  # lxml==5.3.0 ships a cp312 wheel; 3.13 would build from source
      - name: Install Qt runtime system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt PyQt6
      - name: GUI module imports
        shell: bash
        run: |
          python -c "
          import sys
          gui_modules = [
              'gui.tabs.event_hub_tab',
              'gui.tabs.tournament_prep',
              'gui.tabs.dashboard',
              'db.event_hub_db',
          ]
          failed = []
          for m in gui_modules:
              try:
                  __import__(m)
                  print(f'  OK  {m}')
              except Exception as e:
                  print(f'  FAIL {m}: {e}')
                  failed.append(m)
          if failed:
              sys.exit(1)
          "
      - name: Report failure
        if: failure()
        uses: actions/github-script@v8
        with:
          script: |
            const title = `[CI] gui-imports failed — mtg-meta-analyzer`;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              labels: 'needs-fix', state: 'open',
            });
            const existing = issues.find(i => i.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.number,
                body: `Recurred ${new Date().toISOString().slice(0,10)} — [run](${runUrl})`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, labels: ['needs-fix'],
                body: `**Job:** gui-imports\n**Branch:** ${context.ref.replace('refs/heads/','')}\n**Commit:** \`${context.sha.slice(0,7)}\`\n**Run:** [View logs](${runUrl})\n\nA PyQt6 GUI module failed to import. Check gui/ changes for broken imports.`,
              });
            }
