name: runner-diag (temporary)

# Temporary diagnostic: dumps the self-hosted runner's Python environment so we
# can see exactly what NETWORK SERVICE sees. Manually triggered only. Delete after use.
on:
  workflow_dispatch:

jobs:
  diag:
    name: Self-hosted env dump
    runs-on: self-hosted
    steps:
      - name: Identity and PATH
        shell: pwsh
        run: |
          Write-Output "whoami: $(whoami)"
          Write-Output "cwd: $(Get-Location)"
          Write-Output "--- where python ---"
          (Get-Command python -All -ErrorAction SilentlyContinue).Source
          Write-Output "--- python --version ---"
          python --version
          Write-Output "--- python -m pip --version ---"
          python -m pip --version
      - name: Installed packages (key deps)
        shell: pwsh
        run: |
          $pkgs = python -m pip list 2>$null
          Write-Output "total packages: $(($pkgs | Measure-Object -Line).Lines)"
          $pkgs | Select-String -Pattern 'PyQt6|requests|cloudscraper|thefuzz|beautifulsoup4|rapidfuzz|matplotlib|numpy|mcp|anthropic'
      - name: Can it import the gui modules the job needs?
        shell: pwsh
        run: |
          python -c "import PyQt6; print('PyQt6 OK')"
      - name: MTG_META_DB var visibility
        shell: pwsh
        env:
          MTG_META_DB: ${{ vars.MTG_META_DB }}
        run: |
          Write-Output "MTG_META_DB = '$env:MTG_META_DB'"
          if ($env:MTG_META_DB -and (Test-Path $env:MTG_META_DB)) { Write-Output "DB readable: YES" } else { Write-Output "DB readable: NO" }
