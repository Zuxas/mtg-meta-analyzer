name: Claude + Tom gate

# Tests, data-safety guard and DB compatibility on every push/PR to main.
# On PRs, if those pass, Claude (Anthropic API) and Tom (OpenAI API) review the
# diff, cross-examine each other, and the PR gets ONE label:
#   ready-to-merge | needs-changes | needs-human
# Nothing merges automatically.

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write

env:
  PYTHON_VERSION: '3.12'   # lxml==5.3.0 ships cp312 wheels
  QT_QPA_PLATFORM: offscreen
  BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
  HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  safety:
    name: Data-safety guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - name: Resolve base
        run: |
          if [ -z "$BASE_SHA" ] || ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            echo "BASE_SHA=$(git rev-parse HEAD~1)" >> "$GITHUB_ENV"
          fi
      - uses: actions/setup-python@v6
        with: { python-version: '${{ env.PYTHON_VERSION }}' }
      - run: python scripts/ci/check_safety.py --base "$BASE_SHA" --head "$HEAD_SHA"

  tests:
    name: Test suite
    needs: safety
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '${{ env.PYTHON_VERSION }}'
          cache: pip
      - name: Qt runtime libraries
        run: sudo apt-get update -q && sudo apt-get install -y -q libegl1 libgl1 libxkbcommon0 libdbus-1-3 libxkbcommon-x11-0 libxcb-cursor0
      - run: pip install -r requirements.txt PyQt6
      - name: pytest (no live DB, no network)
        run: |
          mkdir -p "$RUNNER_TEMP/db"
          export MTG_META_DB="$RUNNER_TEMP/db/mtg_meta.db" MTG_META_ARCHIVE_DB="$RUNNER_TEMP/db/mtg_archive.db"
          python -m pytest -q -m "not live_db and not network" --junitxml=pytest.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: pytest-results, path: pytest.xml }

  db-compat:
    name: Fresh + older DB compatibility
    needs: safety
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - name: Resolve base
        run: |
          if [ -z "$BASE_SHA" ] || ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            echo "BASE_SHA=$(git rev-parse HEAD~1)" >> "$GITHUB_ENV"
          fi
      - uses: actions/setup-python@v6
        with:
          python-version: '${{ env.PYTHON_VERSION }}'
          cache: pip
      - name: Qt runtime libraries
        run: sudo apt-get update -q && sudo apt-get install -y -q libegl1 libgl1 libxkbcommon0 libdbus-1-3 libxkbcommon-x11-0 libxcb-cursor0
      - run: pip install -r requirements.txt PyQt6
      - name: Fresh database (create + idempotent re-run + save_matches)
        run: python scripts/ci/db_compat.py fresh --dir "$RUNNER_TEMP/fresh"
      - name: Seed an older database with the base commit's code
        run: |
          git worktree add -q "$RUNNER_TEMP/base" "$BASE_SHA"
          cd "$RUNNER_TEMP/base"
          python "$GITHUB_WORKSPACE/scripts/ci/db_compat.py" seed --dir "$RUNNER_TEMP/old"
      - name: Upgrade the older database with this commit's code
        run: python scripts/ci/db_compat.py upgrade --dir "$RUNNER_TEMP/old"
      - name: App starts on a fresh database
        run: python scripts/ci/db_compat.py app --dir "$RUNNER_TEMP/app"

  review:
    name: Claude + Tom review
    needs: [tests, db-compat]
    if: github.event_name == 'pull_request' && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    outputs:
      outcome: ${{ steps.ai.outputs.outcome }}
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v6
        with: { python-version: '${{ env.PYTHON_VERSION }}' }
      - run: pip install anthropic openai
      - id: ai
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: python scripts/ci/ai_review.py
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: ai-review, path: "review.*", if-no-files-found: ignore }
      - name: Post / update the review comment
        if: always() && hashFiles('review.md') != ''
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('review.md', 'utf8');
            const marker = '<!-- claude-tom-gate -->';
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const mine = comments.find(c => c.body && c.body.includes(marker));
            if (mine) await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number, body });

  label:
    name: Set gate label
    needs: [safety, tests, db-compat, review]
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v8
        env:
          SAFETY: ${{ needs.safety.result }}
          TESTS: ${{ needs.tests.result }}
          DB: ${{ needs['db-compat'].result }}
          REVIEW: ${{ needs.review.result }}
          OUTCOME: ${{ needs.review.outputs.outcome }}
          DRAFT: ${{ github.event.pull_request.draft }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const LABELS = {
              'ready-to-merge': ['0e8a16', 'Tests + DB checks pass; Claude and Tom approve'],
              'needs-changes':  ['d93f0b', 'A check failed or a confirmed blocking finding'],
              'needs-human':    ['fbca04', 'Reviewers disagree on a blocking finding'],
            };
            for (const [name, [color, description]] of Object.entries(LABELS)) {
              try { await github.rest.issues.getLabel({ owner, repo, name }); }
              catch { await github.rest.issues.createLabel({ owner, repo, name, color, description }); }
            }
            const e = process.env;
            let want;
            if ([e.SAFETY, e.TESTS, e.DB].some(r => r !== 'success')) want = 'needs-changes';
            else if (e.DRAFT === 'true') want = null;
            else if (e.REVIEW !== 'success' || !e.OUTCOME) want = 'needs-human';  // review crashed / no keys
            else want = e.OUTCOME === 'ready' ? 'ready-to-merge' : e.OUTCOME;
            const current = (await github.rest.issues.listLabelsOnIssue({ owner, repo, issue_number })).data.map(l => l.name);
            for (const name of Object.keys(LABELS)) {
              if (name !== want && current.includes(name))
                await github.rest.issues.removeLabel({ owner, repo, issue_number, name });
            }
            if (want && !current.includes(want))
              await github.rest.issues.addLabels({ owner, repo, issue_number, labels: [want] });
            core.notice(`safety=${e.SAFETY} tests=${e.TESTS} db=${e.DB} review=${e.REVIEW}/${e.OUTCOME} -> ${want ?? 'no label (draft)'}`);
