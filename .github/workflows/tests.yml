name: tests

on:
  push:            # every branch, so stacked PRs and local-merge branches are tested too
  pull_request:

jobs:
  compile:
    name: py_compile all modules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile-check all Python modules
        run: |
          find . -name "*.py" \
            -not -path "./.venv/*" \
            -not -path "./venv/*" \
            -not -path "./__pycache__/*" \
            -not -path "*/__pycache__/*" \
            | xargs python -m py_compile

  pytest:
    name: pytest (Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # 3.12 is pinned because requirements.txt pins lxml==5.3.0, which has no cp313 wheel.
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Qt system libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt PyQt6

      # tests/conftest.py gives every test an empty temp DB and blocks the
      # network; live_db / network tests need the owner's machine.
      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
          MTG_META_DB: ${{ runner.temp }}/meta.db
          MTG_META_ARCHIVE_DB: ${{ runner.temp }}/archive.db
        run: python -m pytest -q -m "not live_db and not network" -p no:cacheprovider
